name: PTT Sync

on:
  schedule:
    - cron: "5 */4 * * *"
  workflow_dispatch:
    inputs:
      since_hours:
        description: "Lookback window in hours"
        required: false
        default: "24"
      min_net_push:
        description: "Minimum net_push threshold"
        required: false
        default: "20"
      max_pages:
        description: "Max board pages to scan"
        required: false
        default: "60"
      max_articles:
        description: "Max article rows to collect"
        required: false
        default: "3000"
      article_limit:
        description: "Max article rows for stock-link stage"
        required: false
        default: "1200"
      require_content:
        description: "Require content in crawl stage (1/0)"
        required: false
        default: "1"
      dry_run:
        description: "Dry run only (1/0)"
        required: false
        default: "0"

jobs:
  ptt-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ptt-sync
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      PTT_SINCE_HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.since_hours || '24' }}
      PTT_MIN_NET_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.min_net_push || '20' }}
      PTT_MAX_PAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_pages || '60' }}
      PTT_MAX_ARTICLES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_articles || '3000' }}
      PTT_ARTICLE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.article_limit || '1200' }}
      PTT_REQUIRE_CONTENT: ${{ github.event_name == 'workflow_dispatch' && inputs.require_content || '1' }}
      PTT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$CRON_SECRET"

      - name: PTT health check
        run: npm run sync:ptt:health

      - name: Crawl PTT board (with retry)
        run: |
          for attempt in 1 2 3; do
            echo "crawl attempt=$attempt"
            if npm run sync:ptt:crawl; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "crawl failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done

      - name: Link stocks by title
        run: npm run sync:ptt:link
