# 定时任务：Vercel Hobby 计划只允许每天一次的 cron，原 vercel.json 里的高频任务
# 导致部署失败，因此统一改由 GitHub Actions 定时调用 /api/sync-* 接口。
#
# - 时间均为 UTC（北京时间 = UTC+8）
# - 每个 cron 对应的接口见 scripts/cron/jobs.json，两处需保持一致（有单测校验）
# - 需要仓库 Secret：CRON_SECRET（与 Vercel 环境变量 CRON_SECRET 相同）
# - 可选仓库变量：SITE_URL（默认 https://twsvp.com）
# - GitHub 定时任务会有几分钟延迟，接口本身按触发的 cron 表达式和北京时间判断要做什么
name: Scheduled jobs

on:
  schedule:
    - cron: "45 1 * * 1-5"       # 台股交易日历
    - cron: "0 4 * * 6,0"        # 周末补日线
    - cron: "0 18 * * 6,0"       # 周末历史回补
    - cron: "*/20 * * * 6,0"     # 周末历史行情
    - cron: "0 16 * * *"         # 观点到期通知 + 观点绩效结算
    - cron: "0 17 * * *"         # 用户绩效
    - cron: "*/30 * * * *"       # NewsData 新闻
    - cron: "*/15 * * * *"       # 公开资讯观测站 RSS
    - cron: "*/10 * * * *"       # 新闻与个股关联
    - cron: "0 2 * * 1-5"        # 缺失行情扫描
    - cron: "*/5 7-15 * * 1-5"   # 缺失行情补录
    - cron: "*/10 * * * 1-5"     # 量化任务
    - cron: "0,30 1-7 * * 1-5"   # 短线情绪工作台（北京时间 09:00–15:30，接口内只在 09:00–15:00 执行）
  workflow_dispatch:
    inputs:
      path:
        description: "手动调用的接口路径，例如 /api/sync-short-emotion?force=1"
        required: true
        default: "/api/sync-short-emotion?force=1"

permissions:
  contents: read

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/cron
      - name: Call scheduled endpoints
        run: node scripts/cron/run-scheduled.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_PATH: ${{ github.event.inputs.path }}
