# 临时探针（探完即删）：验证台股短线情绪的数据来源
name: TW emotion probe
on:
  push:
    branches: [probe/tw-emotion]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe/tw-probe.mjs > "$RUNNER_TEMP/probe.txt" 2>&1; cat "$RUNNER_TEMP/probe.txt"
        env:
          WIND_API_KEY: ${{ secrets.WIND_API_KEY }}
      - name: Publish probe output
        run: |
          mkdir out && cp "$RUNNER_TEMP/probe.txt" out/ && cd out
          git init -q && git checkout -q -b probe/tw-emotion-output && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "probe output"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe/tw-emotion-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
